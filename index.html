<body>
  <div id="eventBanner" class="event-banner" role="status"></div><noscript><div style="padding:20px;background:#fff;color:#000">이 웹앱은 JavaScript를 켜야 사용할 수 있습니다.</div></noscript>
  <header class="topbar">
    <button id="teamBadge" class="team-badge" type="button">읽기 전용</button>
    <div class="live-pill"><span></span> 현황 자동 갱신</div>
  </header>

  <main>
    <section class="map-section" aria-label="광야 어드벤처 지도">
      <div id="mapShell" class="map-shell">
        <img class="map-image" src="map.jpg" alt="광야 어드벤처 미션 지도" />
        <button id="secretTitle" class="secret-title" aria-label="광야 어드벤처 제목"></button>
        <aside class="top3-float" aria-label="실시간 상위 3개 조"><h3>🏆 실시간 TOP 3</h3><div id="top3Mini"></div></aside>

        <button class="hotspot" data-mission="bridge" style="--x:47.2%;--y:28.5%;--w:12.4%;--h:14.5%"><span>믿음의 연결다리</span></button>
        <button class="hotspot" data-mission="fish" style="--x:59.4%;--y:28.3%;--w:12.8%;--h:14.8%"><span>오병이어 바람</span></button>
        <button class="hotspot" data-mission="tree" style="--x:83.7%;--y:38.2%;--w:13.6%;--h:14.8%"><span>지혜의 나무</span></button>
        <button class="hotspot" data-mission="listen" style="--x:36.7%;--y:61.4%;--w:14.2%;--h:15.5%"><span>귀 있는 자는 들으라</span></button>
        <button class="hotspot" data-mission="bible" style="--x:65.9%;--y:64.4%;--w:15.2%;--h:15.5%"><span>말씀 정탐꾼</span></button>
        <button class="hotspot" data-mission="creation" style="--x:46.4%;--y:86.2%;--w:14.7%;--h:13.2%"><span>창조의 손길</span></button>
        <button class="hotspot" data-mission="cross" style="--x:12.8%;--y:49.6%;--w:15.5%;--h:13.3%"><span>광야의 숨은 십자가</span></button>
        <button class="hotspot" data-mission="miracle" style="--x:12.8%;--y:66.8%;--w:15.5%;--h:13%"><span>7일의 기적</span></button>

        <div id="mapBadges" aria-live="polite"></div>
      </div>
    </section>

    <section class="status-panel waiting-panel">
      <div class="section-head"><div><small>WAITING QUEUE</small><h2>참여 대기 신청</h2></div><p>대기 순서를 확인하고 원하는 퀘스트에 신청하세요. 한 조당 최대 2개까지 가능합니다.</p></div>
      <div id="venueGrid" class="venue-grid waiting-grid"></div>
    </section>

    <section class="ranking-panel">
      <div class="section-head"><div><small>MANNA RANKING</small><h2>조별 만나 순위</h2></div><p id="updatedAt"></p></div>
      <div id="rankingList" class="ranking-list"></div>
    </section>
  </main>

  <dialog id="missionDialog" class="modal"><form method="dialog" class="paper-card">
    <button class="close" value="close" aria-label="닫기">×</button>
    <div id="dialogIcon" class="dialog-icon"></div><p id="dialogPlace" class="eyebrow"></p><h2 id="dialogTitle"></h2><p id="dialogDesc"></p>
    <div class="metrics"><div><b id="dialogPlaying"></b><span>참여 중인 조</span></div><div><b id="dialogWaiting"></b><span>대기 중인 조</span></div><div><b id="dialogReward"></b><span>기본 만나</span></div></div>
    <div id="dialogQueueInfo" class="dialog-queue-info"></div>
    <button id="dialogQueueBtn" class="primary queue-primary" type="button">이 퀘스트 대기 신청</button>
    <button class="secondary" value="close">닫기</button>
  </form></dialog>

  <dialog id="loginDialog" class="modal"><form id="loginForm" class="paper-card compact"><button class="close" type="button" data-close="loginDialog">×</button><p class="eyebrow">SECRET ACCESS</p><h2>관리자 비밀번호</h2><input id="adminPassword" type="text" inputmode="text" lang="ko" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="비밀번호 입력" required><button class="primary" type="submit">관리자 모드 열기</button><p id="loginError" class="error"></p></form></dialog>

const missions={

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function emptyVenue(){return{playingTeams:[],queue:[],history:[]}}
function initial(){return{event:{code:EVENT_CODE,status:'running',endedAt:0},venues:Object.fromEntries(mainMissionKeys.map(k=>[k,emptyVenue()])),scores:Object.fromEntries(teams.map(t=>[t,0])),updatedAt:Date.now()}}
function normalizeState(raw={}){const base=initial(),out={...base,...raw,event:{...base.event,...(raw.event||{}),code:EVENT_CODE},scores:{...base.scores,...(raw.scores||{})},venues:{}};for(const k of mainMissionKeys){const old=raw.venues?.[k]||{};let playingTeams=Array.isArray(old.playingTeams)?old.playingTeams.filter(t=>teams.includes(t)):[];if(!playingTeams.length&&Number(old.playing)>0)playingTeams=[];const queue=Array.isArray(old.queue)?old.queue.filter(q=>q&&teams.includes(q.team)).map(q=>({team:q.team,joinedAt:Number(q.joinedAt)||Date.now()})):[];out.venues[k]={playingTeams:[...new Set(playingTeams)],queue:queue.filter((q,i,a)=>a.findIndex(x=>x.team===q.team)===i&&!playingTeams.includes(q.team)),history:Array.isArray(old.history)?old.history.map((h,i)=>({...h,id:h.id||`${Number(h.at)||Date.now()}-legacy-${i}`,reclaimed:Boolean(h.reclaimed)})):[]}}return out}
function load(){try{return normalizeState(JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return initial()}}
let state=load(),currentMission='bridge',adminMission=null,dbRef=null,firebaseReady=false,suppressRemoteWrite=false;
function currentTeam(){return verifiedTeam}
function save(){state=normalizeState(state);state.updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(state));channel?.postMessage(state);render();if(firebaseReady&&!suppressRemoteWrite)dbRef.set(state).catch(()=>setSyncStatus('offline','동기화 실패'))}
function playingCount(k){return state.venues[k]?.playingTeams?.length||0}
function queueFor(k){return state.venues[k]?.queue||[]}
function teamQueueMissions(team){return mainMissionKeys.filter(k=>queueFor(k).some(q=>q.team===team))}
function render(){renderVenues();renderRanking();renderBadges();renderTop3();renderEventState();const u=$('#updatedAt');if(u)u.textContent=`최근 갱신 ${new Date(state.updatedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}`;if($('#adminDialog').open&&adminMission)renderAdminEditor()}
function eventEnded(){return state.event?.status==='ended'}
function renderEventState(){const ended=eventEnded(),banner=$('#eventBanner');document.body.classList.toggle('event-ended',ended);if(ended){banner.textContent=`🏆 광야 어드벤처가 종료되었습니다 · 최종 순위를 확인하세요`;banner.classList.add('show')}else banner.classList.remove('show')}
function statusText(n,required){if(n===0)return'참여 가능';if(n<required)return'팀 모집 중';if(n===required)return'진행 중';return'혼잡'}
function queueSummary(k,team){const q=queueFor(k),idx=q.findIndex(x=>x.team===team);return idx>=0?`내 대기 순서 ${idx+1}번째 · 앞에 ${idx}개 조`:`현재 ${q.length}개 조 대기 중`}
function congestionClass(n,required){if(n===0)return'free';if(n<required)return'normal';return'full'}
function congestionText(n,required){if(n===0)return'🟢 여유';if(n<required)return'🟡 모집 중';return'🔴 진행 중'}
function estimatedWait(k,team){const m=missions[k],v=state.venues[k],idx=v.queue.findIndex(q=>q.team===team);if(idx<0)return v.queue.length?`대기열 기준 약 ${Math.ceil(v.queue.length/Math.max(1,m.required))*m.duration}분`:'바로 참여 가능';const rounds=Math.ceil((idx+1)/Math.max(1,m.required));return idx===0&&v.playingTeams.length<m.required?'곧 참여 가능':`예상 약 ${rounds*m.duration}분 · 앞에 ${idx}개 조`}
function toggleQueue(k){if(eventEnded()){toast('행사가 종료되어 대기 신청을 변경할 수 없습니다.');return}const team=currentTeam();if(!team){toast('조별 전용 QR 또는 NFC 주소로 접속해야 대기 신청할 수 있습니다.');return}const v=state.venues[k],idx=v.queue.findIndex(q=>q.team===team);if(idx>=0){v.queue.splice(idx,1);save();toast(`${missions[k].title} 대기를 취소했습니다.`);return}if(v.playingTeams.includes(team)){toast('현재 이 게임에 참여 중인 조입니다.');return}const applied=teamQueueMissions(team);if(applied.length>=2){toast('한 조당 최대 2개 게임까지만 대기 신청할 수 있습니다.');return}v.queue.push({team,joinedAt:Date.now()});save();toast(`${missions[k].title} 대기 신청이 완료되었습니다.`)}
function renderVenues(){const team=currentTeam();$('#venueGrid').innerHTML=mainMissionKeys.map(k=>{const m=missions[k],v=state.venues[k],n=v.playingTeams.length,q=v.queue,idx=q.findIndex(x=>x.team===team),joined=idx>=0,playing=v.playingTeams.includes(team),cls=congestionClass(n,m.required);return`<article class="venue-card ${joined?'my-queue':''} ${playing?'my-playing':''}"><header><h3>${m.icon} ${m.title}</h3><span class="state ${cls}">${congestionText(n,m.required)}</span></header><div class="count">${n}/${m.required}개 조 참여</div><div>${m.place} · 약 ${m.duration}분</div><div class="playing-team-list">참여 중: ${v.playingTeams.join(', ')||'없음'}</div><div class="queue-list"><b>대기 ${q.length}개 조</b><br>${q.length?q.map((x,i)=>`${i+1}. ${x.team}${x.team===team?' (내 조)':''}`).join('<br>'):'현재 대기 조가 없습니다.'}${joined?`<br><span class="queue-position">내 순서: ${idx+1}번째</span>`:''}</div><div class="estimate">⏱ ${estimatedWait(k,team)}</div><div class="queue-actions"><button class="${joined?'queue-cancel':'queue-join'}" data-queue="${k}" data-queue-action ${playing?'disabled':''}>${playing?'현재 참여 중':joined?'대기 취소':'대기 신청'}</button><button class="queue-join" data-open="${k}">게임 정보</button></div></article>`}).join('');$$('[data-queue]').forEach(b=>b.onclick=()=>toggleQueue(b.dataset.queue));$$('[data-open]').forEach(b=>b.onclick=()=>openMission(b.dataset.open))}
function renderRanking(){const mine=currentTeam(),rows=Object.entries(state.scores).sort((a,b)=>b[1]-a[1]);$('#rankingList').innerHTML=rows.map(([t,s],i)=>`<div class="rank-row ${i<3?'top':''} ${t===mine?'my-team':''}"><span class="rank-no">${['🥇','🥈','🥉'][i]||i+1}</span><span class="rank-name">${t}</span><span class="rank-manna">🥖 ${s} 만나</span></div>`).join('')}
function renderTop3(){const rows=Object.entries(state.scores).sort((a,b)=>b[1]-a[1]).slice(0,3);$('#top3Mini').innerHTML=rows.map(([t,s],i)=>`<div class="top3-mini"><span>${['🥇','🥈','🥉'][i]}</span><b>${t}</b><span>${s}</span></div>`).join('')}
function renderBadges(){$('#mapBadges').innerHTML=mainMissionKeys.map(k=>{const m=missions[k],n=playingCount(k),cls=n===0?'free':n>=m.required?'full':'';return`<span class="map-badge ${cls}" style="left:${m.badge[0]}%;top:${m.badge[1]}%">${n}/${m.required}조</span>`}).join('')}
function openMission(k){currentMission=k;$$('.hotspot').forEach(x=>x.classList.toggle('selected',x.dataset.mission===k));setTimeout(()=>$$('.hotspot').forEach(x=>x.classList.remove('selected')),700);const m=missions[k];$('#dialogIcon').textContent=m.icon;$('#dialogPlace').textContent=m.place;$('#dialogTitle').textContent=m.title;$('#dialogDesc').textContent=m.desc;const qb=$('#dialogQueueBtn'),qi=$('#dialogQueueInfo');if(m.main){const team=currentTeam(),v=state.venues[k],n=v.playingTeams.length,idx=v.queue.findIndex(q=>q.team===team);$('.metrics').style.display='grid';$('#dialogPlaying').textContent=`${n}/${m.required}조`;$('#dialogWaiting').textContent=`${v.queue.length}조`;$('#dialogReward').textContent=`${m.reward}`;qi.style.display='block';qi.innerHTML=`참여 중: <b>${v.playingTeams.join(', ')||'없음'}</b><br>${idx>=0?`내 조는 대기 <b>${idx+1}번째</b>입니다.`:`현재 대기 <b>${v.queue.length}개 조</b>입니다.`}<br>⏱ <b>${estimatedWait(k,team)}</b>`;qb.style.display='block';qb.textContent=idx>=0?'대기 신청 취소':'이 퀘스트 대기 신청';qb.onclick=()=>{toggleQueue(k);openMissionRefresh(k)}}else{$('.metrics').style.display='none';qi.style.display='none';qb.style.display='none'}$('#missionDialog').showModal();navigator.vibrate?.(25)}
function openMissionRefresh(k){const m=missions[k],team=currentTeam(),v=state.venues[k],idx=v.queue.findIndex(q=>q.team===team);$('#dialogPlaying').textContent=`${v.playingTeams.length}/${m.required}조`;$('#dialogWaiting').textContent=`${v.queue.length}조`;$('#dialogQueueInfo').innerHTML=`참여 중: <b>${v.playingTeams.join(', ')||'없음'}</b><br>${idx>=0?`내 조는 대기 <b>${idx+1}번째</b>입니다.`:`현재 대기 <b>${v.queue.length}개 조</b>입니다.`}<br>⏱ <b>${estimatedWait(k,team)}</b>`;$('#dialogQueueBtn').textContent=idx>=0?'대기 신청 취소':'이 퀘스트 대기 신청'}
$$('.hotspot').forEach(b=>b.onclick=()=>openMission(b.dataset.mission));
async function sha256Hex(value){const data=new TextEncoder().encode(value);const digest=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function chooseTeam(){
  const qs=new URLSearchParams(location.search);
  const urlToken=(qs.get('token')||'').trim();
  const storedToken=(localStorage.getItem(TOKEN_STORAGE_KEY)||'').trim();
  const token=urlToken||storedToken;
  verifiedTeam='';
  if(token){
    try{
      const hash=await sha256Hex(token);
      const team=TEAM_TOKEN_HASHES[hash]||'';
      if(team){
        verifiedTeam=team;
        localStorage.setItem(TOKEN_STORAGE_KEY,token);
        localStorage.setItem('gwangya-team',team);
        if(urlToken){
          const clean=new URL(location.href);
          clean.searchParams.delete('team');
          history.replaceState(null,'',clean.pathname+clean.search+clean.hash);
        }
      }else if(urlToken){
        localStorage.removeItem(TOKEN_STORAGE_KEY);
        localStorage.removeItem('gwangya-team');
        toast('유효하지 않은 조별 접속 주소입니다. 대기 신청은 사용할 수 없습니다.');
      }
    }catch(e){console.error(e)}
  }
  $('#teamBadge').textContent=verifiedTeam?`${verifiedTeam} 인증됨`:'읽기 전용';
  $('#teamBadge').title=verifiedTeam?'조별 전용 링크로 인증되었습니다.':'조별 전용 QR 또는 NFC로 접속하세요.';
  render();
}
$('#teamBadge').onclick=()=>toast(verifiedTeam?`${verifiedTeam} 전용 링크로 인증되었습니다.`:'조별 전용 QR 또는 NFC 주소로 접속해야 대기 신청할 수 있습니다.');
chooseTeam();

$('#loginForm').onsubmit=e=>{e.preventDefault();const input=$('#adminPassword');input.blur();setTimeout(()=>{const password=input.value.normalize('NFC').replace(/\s+/g,'').trim(),mission=adminPasswords[password];if(mission){adminMission=mission;$('#loginDialog').close();openAdmin()}else{$('#loginError').textContent='비밀번호가 올바르지 않습니다.';input.focus();input.select()}},30)};
$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());
function openAdmin(){if(!adminMission)return;if(!$('#adminDialog').open)$('#adminDialog').showModal();if(adminMission==='__master__'){$('#adminVenueTabs').innerHTML=`<button class="active" disabled>총괄 관리자 · ${EVENT_CODE}</button>`}else{const m=missions[adminMission];$('#adminVenueTabs').innerHTML=`<button class="active" disabled>${m.title} 전용 관리자</button>`}renderAdminEditor()}
function togglePlaying(team){if(eventEnded()){toast('행사가 종료되었습니다.');return}const v=state.venues[adminMission],i=v.playingTeams.indexOf(team);if(i>=0){v.playingTeams.splice(i,1);toast(`${team} 참여를 해제했습니다.`)}else{v.playingTeams.push(team);v.queue=v.queue.filter(q=>q.team!==team);toast(`${team}을 참여 중으로 반영하고 대기열에서 자동 제외했습니다.`)}save()}
function removeQueueTeam(team){if(eventEnded()){toast('행사가 종료되었습니다.');return}const v=state.venues[adminMission];v.queue=v.queue.filter(q=>q.team!==team);save();toast(`${team}을 대기열에서 삭제했습니다.`)}
async function sha256Hex(text){const data=new TextEncoder().encode(text);const hash=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('')}
function finishGame(team){if(eventEnded()){toast('행사가 종료되었습니다.');return}const v=state.venues[adminMission],m=missions[adminMission],i=v.playingTeams.indexOf(team);if(i<0)return;if(!confirm(`${team} 게임을 종료할까요?`))return;v.playingTeams.splice(i,1);let promoted=null;if(v.queue.length&&v.playingTeams.length<m.required){promoted=v.queue.shift().team;v.playingTeams.push(promoted)}save();toast(promoted?`${team} 게임 종료 · ${promoted} 자동 참여 시작`:`${team} 게임을 종료했습니다.`)}
function awardManna(team,amount){if(eventEnded()){toast('행사가 종료되었습니다.');return}const v=state.venues[adminMission],at=Date.now();state.scores[team]=Math.max(0,(state.scores[team]||0)+amount);v.history.push({id:`${at}-${Math.random().toString(36).slice(2,8)}`,team,amount,at,reclaimed:false});save();coinBurst();toast(`${team}에 ${amount>=0?'+':''}${amount} 만나를 반영했습니다.`)}
function reclaimManna(historyId){if(eventEnded()){toast('행사가 종료되었습니다.');return}const v=state.venues[adminMission],h=(v.history||[]).find(x=>x.id===historyId);if(!h||h.reclaimed||Number(h.amount)<=0){toast('회수할 수 없는 지급 기록입니다.');return}if(!confirm(`${h.team}에 지급한 ${h.amount} 만나를 회수할까요?`))return;state.scores[h.team]=Math.max(0,(state.scores[h.team]||0)-Number(h.amount));h.reclaimed=true;h.reclaimedAt=Date.now();save();toast(`${h.team}에서 ${h.amount} 만나를 회수했습니다.`)}
function renderAdminEditor(){if(adminMission==='__master__'){renderMasterAdmin();return}const m=missions[adminMission],v=state.venues[adminMission];$('#adminEditor').innerHTML=`<div class="admin-grid"><section class="admin-box"><h3>${m.icon} ${m.title} 참여 조 선택</h3><p>${m.place} · 현재 <b>${v.playingTeams.length}/${m.required}개 조</b> 참여 중</p><div class="team-toggle-grid">${teams.map(t=>`<button class="team-toggle ${v.playingTeams.includes(t)?'active':''}" data-playing-team="${t}">${v.playingTeams.includes(t)?'✓ ':''}${t}</button>`).join('')}</div><p class="queue-limit-note">참여 조를 누르면 대기열에서 자동 제외됩니다.</p><h3>현재 게임 진행 조</h3><div class="playing-admin-list">${v.playingTeams.map(t=>`<div class="playing-admin-item"><b>${t}</b><button class="finish-btn" data-finish-team="${t}">게임 종료</button></div>`).join('')||'<p>현재 참여 중인 조가 없습니다.</p>'}</div><div class="promote-note">게임 종료 시 메인 운영자 승인코드가 필요하며, 승인 후 대기열 첫 번째 조가 빈 자리에 자동으로 들어갑니다.</div><h3>현재 대기열 (${v.queue.length}개 조)</h3><div class="admin-queue">${v.queue.map((q,i)=>`<div class="admin-queue-item ${i===0?'queue-next':''}"><span><b>${i+1}번째</b> ${q.team}${i===0?' · 다음 참여':''}</span><button data-remove-queue="${q.team}">삭제</button></div>`).join('')||'<p>대기 중인 조가 없습니다.</p>'}</div></section><section class="admin-box"><h3>만나 지급</h3><div class="award-row"><select id="awardTeam">${teams.map(t=>`<option>${t}</option>`).join('')}</select><input id="awardAmount" type="number" min="-50" max="50" value="${m.reward}"><button id="awardBtn">직접 반영</button></div><div class="quick-awards"><button data-award="1">+1</button><button data-award="3">+3</button><button data-award="5">+5</button><button data-award="${m.reward}">기본 +${m.reward}</button></div><div class="history award-history">${(v.history||[]).slice().reverse().map(h=>`<div class="award-history-item ${h.reclaimed?'reclaimed':''}"><span>${h.team} ${h.amount>=0?'+':''}${h.amount} 만나 · ${new Date(h.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}${h.reclaimed?' · 회수 완료':''}</span>${Number(h.amount)>0&&!h.reclaimed?`<button type="button" class="reclaim-btn" data-reclaim-id="${h.id||''}">회수</button>`:''}</div>`).join('')||'<div>아직 지급 기록이 없습니다.</div>'}</div></section></div>`;$$('[data-playing-team]').forEach(b=>b.onclick=()=>togglePlaying(b.dataset.playingTeam));$$('[data-remove-queue]').forEach(b=>b.onclick=()=>removeQueueTeam(b.dataset.removeQueue));$$('[data-finish-team]').forEach(b=>b.onclick=()=>finishGame(b.dataset.finishTeam));$$('[data-award]').forEach(b=>b.onclick=()=>awardManna($('#awardTeam').value,Number(b.dataset.award)));$$('[data-reclaim-id]').forEach(b=>b.onclick=()=>reclaimManna(b.dataset.reclaimId));$('#awardBtn').onclick=()=>{const amount=Number($('#awardAmount').value);if(Number.isFinite(amount))awardManna($('#awardTeam').value,amount)}}
function renderMasterAdmin(){
  const ended=eventEnded();
  const totalQueued=mainMissionKeys.reduce((n,k)=>n+state.venues[k].queue.length,0);
  const totalPlaying=mainMissionKeys.reduce((n,k)=>n+state.venues[k].playingTeams.length,0);
  const ranking=Object.entries(state.scores).sort((a,b)=>b[1]-a[1]);
  $('#adminEditor').innerHTML=`<div class="admin-grid"><section class="admin-box master-box"><h3>🎛️ 행사 총괄 관리</h3><div class="event-meta"><b>행사코드:</b> ${EVENT_CODE}<br><b>상태:</b> ${ended?'종료됨':'진행 중'}<br><b>현재 참여:</b> ${totalPlaying}개 조 · <b>전체 대기:</b> ${totalQueued}개 조</div><div class="master-actions"><button class="${ended?'safe':'danger'}" id="eventToggleBtn">${ended?'행사 다시 시작':'행사 종료·순위 확정'}</button><button class="danger" id="resetEventBtn">테스트 데이터 전체 초기화</button><button class="neutral" id="closeMasterBtn">관리자 화면 닫기</button></div><p class="queue-limit-note">초기화는 참여 조, 대기열, 만나 점수와 지급 기록을 모두 삭제합니다.</p></section><section class="admin-box"><h3>현재 순위 미리보기</h3>${ranking.slice(0,13).map(([t,score],i)=>`<div class="history"><div><b>${i+1}위 ${t}</b> · ${score} 만나</div></div>`).join('')}</section></div>`;
  $('#eventToggleBtn').onclick=()=>{if(ended){if(!confirm('행사를 다시 진행 상태로 전환할까요?'))return;state.event.status='running';state.event.endedAt=0}else{if(!confirm('행사를 종료하고 참가자 대기 신청 및 게임장 수정을 잠글까요?'))return;state.event.status='ended';state.event.endedAt=Date.now()}save();toast(state.event.status==='ended'?'행사를 종료하고 순위를 확정했습니다.':'행사를 다시 시작했습니다.')};
  $('#resetEventBtn').onclick=()=>{const phrase=prompt('전체 초기화를 실행하려면 "초기화"를 입력하세요.');if(phrase!=='초기화'){toast('초기화를 취소했습니다.');return}state=initial();save();toast('모든 테스트 데이터를 초기화했습니다.')};
  $('#closeMasterBtn').onclick=()=>$('#adminDialog').close();
}
function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.remove('show'),2300)}
window.addEventListener('storage',e=>{if(e.key===KEY){state=load();render()}});channel&&(channel.onmessage=e=>{state=normalizeState(e.data);render()});
function setSyncStatus(cls,text){const el=$('#syncStatus');el.className='sync-status '+cls;el.textContent=text}
function initFirebase(){try{const c=window.GWANGYA_FIREBASE_CONFIG;if(!c||!c.apiKey||c.apiKey.includes('여기에')){setSyncStatus('','로컬 시연 모드');return}firebase.initializeApp(c);dbRef=firebase.database().ref(`gwangyaAdventure/events/${EVENT_CODE}/state`);firebaseReady=true;setSyncStatus('online','실시간 연결됨');dbRef.on('value',snap=>{const remote=snap.val();if(remote){suppressRemoteWrite=true;state=normalizeState(remote);localStorage.setItem(KEY,JSON.stringify(state));render();suppressRemoteWrite=false}else dbRef.set(state)},()=>setSyncStatus('offline','연결 오류'))}catch(e){console.error(e);setSyncStatus('offline','Firebase 설정 오류')}}
function coinBurst(){const r=$('#awardBtn')?.getBoundingClientRect();for(let i=0;i<7;i++){const el=document.createElement('span');el.className='coin-fx';el.textContent='🥖';el.style.left=((r?.left||innerWidth/2)+Math.random()*80)+'px';el.style.top=((r?.top||innerHeight/2)+Math.random()*30)+'px';el.style.animationDelay=(i*.05)+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),1300)}}
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#installBtn').style.display='block'});$('#installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('#installBtn').style.display='none'};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));render();initFirebase();
</script>
</body>
